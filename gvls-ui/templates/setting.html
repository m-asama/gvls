{% extends "_layout.html" %}

{%- block title -%}
Setting - 銀座堂仮想 LAN サービス
{%- endblock -%}

{%- block content -%}
<section class="vstack">
  <h1>Setting</h1>
  <p>Signed in as {{ mail_addr }}</p>
{%- if message != "" -%}
  <article class="danger">{{ message }}</article>
{%- endif -%}
  <form method="post" class="card vstack">
    <label>Current password <input name="current_password" type="password" required></label>
    <label>New password <input name="new_password" type="password" required></label>
    <label>Confirm new password <input name="new_password_confirm" type="password" required></label>
    <div><button type="submit">Update password</button></div>
  </form>
</section>
{%- endblock -%}
